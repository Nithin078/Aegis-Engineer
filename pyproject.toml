[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-engineer"
version = "0.1.0"
description = "Autonomous Software Engineering Platform with Repository Intelligence"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "Aegis Engineer" }]
keywords = ["ai", "agents", "software-engineering", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
aegis = "aegis.cli.main:app"

[project.urls]
Homepage = "https://github.com/aegis-engineer/aegis-engineer"
Documentation = "https://github.com/aegis-engineer/aegis-engineer#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.hatch.build.targets.sdist]
include = ["src/aegis", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["aegis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aegis"]
mypy_path = "src"
